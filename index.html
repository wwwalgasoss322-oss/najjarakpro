<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>نجارك برو</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:Tahoma}body{background:#f6f2ec;padding-bottom:80px}header{background:#1a120b;color:#fff;padding:14px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}header b{font-size:22px}.menuBtn{background:#d4a24a;border:none;padding:9px 13px;border-radius:10px;font-weight:bold}.drawer{position:fixed;top:0;right:-300px;width:280px;height:100%;background:#1a120b;color:#fff;z-index:99;padding:16px;transition:.3s}.drawer.open{right:0}.drawer button{width:100%;background:#d4a24a;color:#000;border:none;padding:12px;border-radius:12px;font-weight:bold;margin:6px 0}.card{background:#fff;border-radius:16px;padding:14px;margin:12px;box-shadow:0 2px 10px rgba(0,0,0,.08)}.card img{width:100%;height:180px;object-fit:cover;border-radius:12px}.btn{width:100%;background:#1a120b;color:#fff;border:none;padding:12px;border-radius:12px;font-weight:bold;margin-top:8px}.btnGold{background:#d4a24a;color:#000}.btnGreen{background:#25D366}.section{display:none}.section.active{display:block}input,select,textarea{width:100%;border:1px solid #ddd;padding:12px;border-radius:12px;margin:5px 0}.tabs{display:flex;gap:8px;overflow-x:auto;padding:10px 12px}.tabs button{background:#fff;border:1px solid #ddd;padding:9px 16px;border-radius:20px;white-space:nowrap}.tabs button.active{background:#1a120b;color:#fff}.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;justify-content:space-around;padding:10px 0;border-top:1px solid #eee}.bottom button{background:none;border:none;color:#999}.bottom button.active{color:#1a120b;font-weight:bold}.hidden{display:none}.result{background:#e8f5e9;padding:12px;border-radius:10px;margin-top:10px;font-weight:bold;text-align:center;display:none}</style></head><body>
<div class="drawer" id="drawer"><h3>☰ القائمة</h3><p id="userShow" style="color:#ccc;margin:10px 0">زائر - سجل دخول</p><button onclick="show('home');closeD()">🏠 الرئيسية</button><button onclick="show('account');closeD()">👤 حسابي / دخول</button><button onclick="show('add');closeD()">➕ إضافة عرض</button><button onclick="show('myOffers');closeD()">📦 عروضي</button><button onclick="show('calc');closeD()">🧮 حاسبة الدولاب</button><button onclick="closeD()">❌ إغلاق</button></div>
<header><div><b>🪚 نجارك برو</b><br><span style="font-size:12px;opacity:.8" id="welcome">أهلاً بيك</span></div><button class="menuBtn" onclick="document.getElementById('drawer').classList.add('open')">☰ القائمة</button></header>
<div style="padding:10px 12px"><input id="searchBox" placeholder="🔍 ابحث: دولاب، ترابيزة..." oninput="render()"></div>
<div class="tabs"><button class="active" onclick="filterCat('all',this)">الكل</button><button onclick="filterCat('دولاب',this)">دواليب</button><button onclick="filterCat('ترابيزة',this)">ترابيز</button><button onclick="filterCat('مدرج',this)">مدرجات</button><button onclick="filterCat('سرير',this)">سراير</button></div>
<div id="home" class="section active"><div class="card" style="background:#1a120b;color:#fff"><h3>شغل نضيف، بسعر واضح</h3><p style="color:#ddd">اطلب بالواتساب مباشرة</p><button class="btn btnGold" onclick="show('calc')">احسب سعر دولابك</button></div><div id="catalog"></div></div>
<div id="account" class="section"><div class="card"><h3>تسجيل / دخول</h3><div id="loginBox"><input id="loginUser" placeholder="اسم المستخدم"><input id="loginPass" type="password" placeholder="كلمة المرور"><button class="btn" onclick="login()">دخول</button><p style="text-align:center;margin:8px">ما عندك حساب؟ <a href="#" onclick="toggleAuth(true);return false">إنشاء حساب</a></p></div><div id="registerBox" class="hidden"><input id="regName" placeholder="الاسم الكامل"><input id="regUser" placeholder="اسم المستخدم"><input id="regPhone" placeholder="رقم الواتساب 0912345678"><input id="regPass" type="password" placeholder="كلمة المرور"><button class="btn btnGold" onclick="register()">إنشاء حساب</button><p style="text-align:center;margin-top:8px"><a href="#" onclick="toggleAuth(false);return false">عندي حساب، دخول</a></p></div><div id="authResult" class="result"></div><button class="btn" onclick="logout()" style="background:#c00">تسجيل خروج</button></div></div>
<div id="add" class="section"><div class="card"><h3>➕ إضافة عرض جديد</h3><input id="pName" placeholder="اسم المنتج: دولاب 3 ضلفة"><select id="pCat"><option>دولاب</option><option>ترابيزة</option><option>مدرج</option><option>سرير</option></select><input id="pPrice" type="number" placeholder="السعر"><textarea id="pDesc" placeholder="الوصف: الخامة، المقاس..."></textarea><label>صورة المنتج * إجبارية</label><input type="file" id="pImg" accept="image/*" onchange="previewImg(event)"><img id="pPreview" style="display:none;height:150px;margin-top:8px"><button class="btn btnGold" onclick="addProduct()">نشر العرض</button><div id="pResult" class="result"></div></div></div>
<div id="myOffers" class="section"><div class="card"><h3>📦 عروضي</h3><div id="myList"></div></div></div>
<div id="calc" class="section"><div class="card"><h3>حاسبة الدولاب</h3><p>الضلفة = 550,000 ج</p><select id="doorCount" onchange="calcDoor()"><option value="1">1 ضلفة</option><option value="2">2 ضلفة</option><option value="3" selected>3 ضلفة</option><option value="4">4 ضلفة</option><option value="5">5 ضلفة</option><option value="6">6 ضلفة</option></select><div id="doorResult" class="result" style="display:block">3 ضلفة = 1,650,000 ج</div><button class="btn btnGreen" onclick="orderDoor()">اطلب واتساب</button></div></div>
<div class="bottom"><button class="active" onclick="show('home',this)">الرئيسية</button><button onclick="show('calc',this)">حاسبة</button><button onclick="show('add',this)">➕ أضف عرض</button><button onclick="show('account',this)">حسابي</button></div>
<script>
let cur='all',tempImg='';
let products=JSON.parse(localStorage.getItem('najjarak_products')||'null')||[{id:1,cat:'دولاب',name:'دولاب 3 ضلفة - مهوقني',price:1650000,desc:'مهوقني أصلي',img:'https://images.unsplash.com/photo-1595428774223-ef52624120d2?w=800'},{id:2,cat:'مدرج',name:'مدرج خشب قوي',price:350000,desc:'موسكي',img:'https://images.unsplash.com/photo-1524758631624-e2822e304c36?w=800'},{id:3,cat:'ترابيزة',name:'ترابيزة ريزن',price:350000,desc:'خشب + ريزن',img:'https://images.unsplash.com/photo-1533090481720-856c6e3c1fdc?w=800'}];
function fmt(n){return Math.round(n).toLocaleString('en-US')+' ج'}
function closeD(){document.getElementById('drawer').classList.remove('open')}
function show(id,b){document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.bottom button').forEach(x=>x.classList.remove('active'));if(b)b.classList.add('active');closeD()}
function filterCat(c,b){cur=c;document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));if(b)b.classList.add('active');render()}
function render(){let q=(document.getElementById('searchBox').value||'').toLowerCase();let list=products.filter(p=>(cur=='all'||p.cat==cur)&&(p.name+p.desc).toLowerCase().includes(q));let el=document.getElementById('catalog');el.innerHTML='';list.forEach(p=>{el.innerHTML+=`<div class="card"><img src="${p.img}"><h3>${p.name}</h3><p>${p.desc}</p><div style="font-weight:bold;color:#8b5a2b">${fmt(p.price)}</div><button class="btn btnGreen" onclick="orderP('${p.name}',${p.price})">اطلب واتساب</button></div>`});document.getElementById('myList').innerHTML=products.map(p=>`<p>• ${p.name} - ${fmt(p.price)}</p>`).join('')}
function orderP(n,pr){window.open(`https://wa.me/249912345678?text=${encodeURIComponent('عايز أطلب: '+n+' - '+fmt(pr))}`,'_blank')}
function orderDoor(){let n=+document.getElementById('doorCount').value;orderP(`دولاب ${n} ضلفة`,n*550000)}
function calcDoor(){let n=+document.getElementById('doorCount').value;let r=document.getElementById('doorResult');r.style.display='block';r.innerHTML=`${n} ضلفة = ${fmt(n*550000)}`}
function toggleAuth(reg){document.getElementById('loginBox').classList.toggle('hidden',reg);document.getElementById('registerBox').classList.toggle('hidden',!reg)}
function register(){let name=document.getElementById('regName').value.trim(),user=document.getElementById('regUser').value.trim(),phone=document.getElementById('regPhone').value.trim(),pass=document.getElementById('regPass').value;if(!name||!user||!phone||!pass){alert('أملأ كل الخانات');return}let users=JSON.parse(localStorage.getItem('najjarak_users')||'[]');if(users.find(u=>u.user==user)){alert('اسم المستخدم مستخدم');return}users.push({name,user,phone,pass});localStorage.setItem('najjarak_users',JSON.stringify(users));localStorage.setItem('najjarak_current',JSON.stringify({name,user,phone}));loadUser();let r=document.getElementById('authResult');r.style.display='block';r.innerHTML=`مرحباً يا ${name} ✅ حسابك اتعمل`}
function login(){let user=document.getElementById('loginUser').value.trim(),pass=document.getElementById('loginPass').value;let users=JSON.parse(localStorage.getItem('najjarak_users')||'[]');let u=users.find(x=>x.user==user&&x.pass==pass);if(!u){alert('البيانات غلط');return}localStorage.setItem('najjarak_current',JSON.stringify(u));loadUser();let r=document.getElementById('authResult');r.style.display='block';r.innerHTML=`مرحباً يا ${u.name} ✅`}
function logout(){localStorage.removeItem('najjarak_current');location.reload()}
function loadUser(){try{let u=JSON.parse(localStorage.getItem('najjarak_current'));if(u){document.getElementById('userShow').innerText=u.name+' (@'+u.user+')';document.getElementById('welcome').innerText='أهلاً يا '+u.name+' 👋'}}catch(e){}}
function previewImg(e){let f=e.target.files[0];if(!f)return;let rd=new FileReader();rd.onload=ev=>{tempImg=ev.target.result;let p=document.getElementById('pPreview');p.src=tempImg;p.style.display='block'};rd.readAsDataURL(f)}
function addProduct(){let name=document.getElementById('pName').value.trim(),cat=document.getElementById('pCat').value,price=+document.getElementById('pPrice').value,desc=document.getElementById('pDesc').value;if(!name||!price){alert('اكتب الاسم والسعر');return}if(!tempImg){alert('⛔ لازم صورة');return}products.unshift({id:Date.now(),cat,name,price,desc,img:tempImg});localStorage.setItem('najjarak_products',JSON.stringify(products));let r=document.getElementById('pResult');r.style.display='block';r.innerHTML='تم نشر العرض ✅';render();show('home')}
render();loadUser();calcDoor();
</script></body></html>
